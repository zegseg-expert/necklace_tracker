<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TrackLace Guardian Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
    .header { background: #1a73e8; color: white; padding: 20px; text-align: center; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .stat { text-align: center; background: #f8f9fa; padding: 15px; border-radius: 8px; }
    .stat h4 { margin: 0 0 5px; color: #555; }
    .stat p { font-size: 20px; font-weight: bold; margin: 0; }
    #map { height: 400px; width: 100%; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f1f3f4; }
    .badge { padding: 4px 12px; border-radius: 20px; font-weight: bold; }
    .badge-green { background: #e6f4ea; color: #1e8e3e; }
    .badge-red { background: #fce8e6; color: #c5221f; }
    .badge-yellow { background: #fef7e0; color: #e37400; }
  </style>
</head>
<body>
  <div class="header"><h1>🛡️ TrackLace Guardian Dashboard</h1></div>
  <div class="container">
    
    <div class="card">
      <div class="grid">
        <div class="stat"><h4>🛰️ GPS Status</h4><p id="gpsStatus">Waiting...</p></div>
        <div class="stat"><h4>⚠️ Fall Status</h4><p id="fallStatus">Monitoring</p></div>
        <div class="stat"><h4>🚶 Activity</h4><p id="activity">--</p></div>
        <div class="stat"><h4>📌 Position</h4><p id="position">--</p></div>
      </div>
    </div>

    <div class="card"><div id="map"></div></div>

    <div class="card">
      <h2>📜 Last 10 Events</h2>
      <table>
        <thead><tr><th>Time</th><th>Lat</th><th>Lng</th><th>Activity</th></tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ── YOUR FIREBASE CONFIG ─────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyBAPvmTe6Tyf2pZuYTrJs4Z8i5ASAALWJs",
      databaseURL: "https://tracklace-f3b73-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const map = L.map('map').setView([9.656, 6.529], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let marker;

    // ── Listen to main data ──────────────────────────────────
    const neckRef = db.ref('/necklace');
    neckRef.on('value', (snap) => {
      const d = snap.val();
      if (!d) return;
      document.getElementById('gpsStatus').innerHTML = d.gpsStatus === 'FIXED' ? '<span class="badge badge-green">FIXED</span>' : '<span class="badge badge-yellow">Searching</span>';
      document.getElementById('activity').innerText = d.activity || '--';
      document.getElementById('position').innerText = d.lat && d.lng ? d.lat.toFixed(6) + ', ' + d.lng.toFixed(6) : 'No Fix';
      if (d.lat && d.lng) {
        const pos = [d.lat, d.lng];
        if (marker) marker.setLatLng(pos);
        else marker = L.marker(pos).addTo(map);
        map.panTo(pos);
      }
    });

    // ── Listen to fall alerts ─────────────────────────────────
    const alertRef = db.ref('/alerts/lastFall');
    alertRef.on('value', (snap) => {
      const f = snap.val();
      if (f && f.status === 'FALL_DETECTED') {
        document.getElementById('fallStatus').innerHTML = '<span class="badge badge-red">🚨 FALL DETECTED!</span>';
        setTimeout(() => document.getElementById('fallStatus').innerHTML = 'Monitoring', 10000);
      }
    });

    // ── Listen to history ─────────────────────────────────────
    const histRef = db.ref('/history').limitToLast(10);
    histRef.on('value', (snap) => {
      const h = snap.val();
      const tbody = document.getElementById('historyBody');
      tbody.innerHTML = '';
      if (!h) return;
      Object.keys(h).reverse().forEach(k => {
        const r = h[k];
        tbody.innerHTML += `<tr><td>${r.timestamp || '--'}</td><td>${r.lat || 0}</td><td>${r.lng || 0}</td><td>${r.activity || '--'}</td></tr>`;
      });
    });
  </script>
</body>
</html>
